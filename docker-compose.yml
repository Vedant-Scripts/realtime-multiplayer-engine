version: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: nakama-postgres
    environment:
      POSTGRES_DB: nakama
      POSTGRES_USER: nakama
      POSTGRES_PASSWORD: localdb
    ports:
      - "5432:5432"
    volumes:
      - nakama_pgdata:/var/lib/postgresql/data

  nakama:
    image: heroiclabs/nakama
    container_name: nakama
    depends_on:
      - postgres
    entrypoint:
          - "/bin/sh"
          - "-ecx"
          - |
            until /nakama/nakama migrate up --database.address nakama:localdb@postgres:5432/nakama; do
              echo "Waiting for Postgres..."
              sleep 2
            done

            exec /nakama/nakama \
            --name nakama1 \
            --database.address nakama:localdb@postgres:5432/nakama \
            --logger.level DEBUG \
            --session.token_expiry_sec 7200 \
            --runtime.path /nakama/data/modules \
            --runtime.js_entrypoint index.js
    volumes:
      - ./backend/nakama/build:/nakama/data/modules
    ports:
      - "7350:7350"
      - "7351:7351"

volumes:
  nakama_pgdata: